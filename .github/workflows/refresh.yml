# Redraws the pictures once a day and refreshes the pull request counts from GitHub search.
# Public sources only; the advisory counts are kept by hand in data/advisories.json.
name: Refresh pictures

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-security
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh.mjs
      - name: Commit when something moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A assets data HALL_OF_FAME.md
          if git diff --cached --quiet; then echo "nothing moved"; exit 0; fi
          git config user.name "HEY Research Lab"
          git config user.email "327801004+hey-research-lab@users.noreply.github.com"
          git commit -m "Security: refresh the numbers"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
