<text x="340" y="513" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A0AD">Eight items across the vault contracts, relay, SDK, MCP</text><text x="340" y="534" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#94A0AD">server and app</text>
