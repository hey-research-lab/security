<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="How disclosure works: read the code, report privately, the team fixes, publish and credit. We ask for an answer within 14 days and give 90 days to fix, longer when the team is working on it.">
<style>.w{stroke-dasharray:6 6;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}.dot{animation:travel 9s ease-in-out infinite}@keyframes travel{0%,8%{transform:translateX(0)}85%,100%{transform:translateX(580px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1200" height="440" rx="14" fill="#F5F6F8"/>
<text x="40" y="50" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#4F7A00">HOW DISCLOSURE WORKS</text>
<text x="40" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#535B66">The same four steps for every project, whatever its size.</text>
<g><rect x="40" y="100" width="250" height="180" rx="12" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="60" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#4F7A00">01</text>
<text x="60" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#0B0E11">Read the code</text>
<text x="60" y="196" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">Public source and on-chain</text><text x="60" y="216" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">state, read-only. Anything we</text><text x="60" y="236" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">reproduce, we reproduce on a</text><text x="60" y="256" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">local fork.</text></g>
<g><rect x="330" y="100" width="250" height="180" rx="12" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="350" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#4F7A00">02</text>
<text x="350" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#0B0E11">Report privately</text>
<text x="350" y="196" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">Through the project’s own</text><text x="350" y="216" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">channel. With none, an issue</text><text x="350" y="236" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">that names no finding and only</text><text x="350" y="256" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">asks where to write.</text></g>
<g><rect x="620" y="100" width="250" height="180" rx="12" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="640" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#4F7A00">03</text>
<text x="640" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#0B0E11">The team fixes</text>
<text x="640" y="196" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">We ask for an answer within 14</text><text x="640" y="216" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">days and give 90 days to fix,</text><text x="640" y="236" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">longer when the team is</text><text x="640" y="256" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">working on it.</text></g>
<g><rect x="910" y="100" width="250" height="180" rx="12" fill="#FFFFFF" stroke="#DDE1E7"/>
<text x="930" y="134" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#4F7A00">04</text>
<text x="930" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#0B0E11">Publish and credit</text>
<text x="930" y="196" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">A short summary once it is</text><text x="930" y="216" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">fixed, with credit to the</text><text x="930" y="236" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">team. Nothing that would help</text><text x="930" y="256" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#535B66">someone exploit it.</text></g>
<path class="w" style="animation-delay:0.0s" d="M294 190H320" stroke="#4F7A00" stroke-width="2"/><path d="M318 185L326 190L318 195" fill="none" stroke="#4F7A00" stroke-width="2" stroke-linejoin="round"/><path class="w" style="animation-delay:0.4s" d="M584 190H610" stroke="#4F7A00" stroke-width="2"/><path d="M608 185L616 190L608 195" fill="none" stroke="#4F7A00" stroke-width="2" stroke-linejoin="round"/><path class="w" style="animation-delay:0.8s" d="M874 190H900" stroke="#4F7A00" stroke-width="2"/><path d="M898 185L906 190L898 195" fill="none" stroke="#4F7A00" stroke-width="2" stroke-linejoin="round"/>
<line x1="165" x2="455" y1="344" y2="344" stroke="#C5CBD3" stroke-width="2" stroke-dasharray="2 6"/>
<line x1="455" x2="900" y1="344" y2="344" stroke="#0B0E11" stroke-width="2"/>
<line x1="900" x2="1035" y1="344" y2="344" stroke="#4F7A00" stroke-width="2" stroke-dasharray="6 6"/>
<text x="165" y="374" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0B0E11">Reading</text>
<text x="165" y="394" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#535B66">no clock yet</text>
<line x1="455" x2="455" y1="336" y2="352" stroke="#0B0E11" stroke-width="2"/><text x="459" y="374" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0B0E11">Day 0</text><text x="459" y="394" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#535B66">report sent</text>
<line x1="524.2222222222222" x2="524.2222222222222" y1="336" y2="352" stroke="#0B0E11" stroke-width="2"/><text x="520.2222222222222" y="374" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0B0E11">Day 14</text><text x="520.2222222222222" y="394" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#535B66">no answer: we say a report was sent</text>
<line x1="900" x2="900" y1="336" y2="352" stroke="#0B0E11" stroke-width="2"/><text x="900" y="374" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0B0E11">Day 90</text><text x="900" y="394" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#535B66">fix window, extendable</text>
<circle cx="1035" cy="344" r="7" fill="#4F7A00"/>
<text x="1035" y="374" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#0B0E11">After the fix</text>
<text x="1035" y="394" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#535B66">publish and credit</text>
<circle class="dot" cx="455" cy="344" r="5" fill="#4F7A00"/>
<text x="40" y="422" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#535B66">If a problem is being exploited in the wild, we may shorten these steps to warn users sooner.</text>
</svg>
